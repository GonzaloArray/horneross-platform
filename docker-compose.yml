services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: horneross
      POSTGRES_PASSWORD: horneross
      POSTGRES_DB: horneross
    volumes:
      - postgres_data:/var/lib/postgresql/data

